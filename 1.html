<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz osobowy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 30px 15px;
        }

        .formularz {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .prawo-jazdy {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .prawo-jazdy label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            margin: 0;
        }

        .prawo-jazdy input {
            width: auto;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5266d5;
        }

        .blad {
            border: 2px solid red;
            background-color: #fff0f0;
        }

        .poprawne {
            border: 2px solid green;
        }

        .komunikat {
            color: red;
            font-size: 12px;
            margin-top: 5px;
        }

    </style>
</head>

<body>

<div class="formularz">

    <h1>Formularz osobowy</h1>

    <form id="formularz">

        <label for="imie">Imię:</label>
        <input type="text" id="imie" name="imie">

        <label for="nazwisko">Nazwisko:</label>
        <input type="text" id="nazwisko" name="nazwisko">

        <label for="email">Adres e-mail:</label>
        <input type="text" id="email" name="email">

        <label for="telefon">Numer telefonu:</label>
        <input type="tel" id="telefon" name="telefon"
               placeholder="Np. 123456789">

        <label>Czy posiadasz prawo jazdy?</label>

        <div class="prawo-jazdy">

            <label>
                <input type="radio" name="prawo_jazdy" value="tak">
                Tak
            </label>

            <label>
                <input type="radio" name="prawo_jazdy" value="nie">
                Nie
            </label>

        </div>

        <label for="wojewodztwo">Województwo:</label>

        <select id="wojewodztwo" name="wojewodztwo">
            <option value="">Wybierz województwo</option>
            <option value="Dolnośląskie">Dolnośląskie</option>
            <option value="Kujawsko-pomorskie">Kujawsko-pomorskie</option>
            <option value="Lubelskie">Lubelskie</option>
            <option value="Lubuskie">Lubuskie</option>
            <option value="Łódzkie">Łódzkie</option>
            <option value="Małopolskie">Małopolskie</option>
            <option value="Mazowieckie">Mazowieckie</option>
            <option value="Opolskie">Opolskie</option>
            <option value="Podkarpackie">Podkarpackie</option>
            <option value="Podlaskie">Podlaskie</option>
            <option value="Pomorskie">Pomorskie</option>
            <option value="Śląskie">Śląskie</option>
            <option value="Świętokrzyskie">Świętokrzyskie</option>
            <option value="Warmińsko-mazurskie">Warmińsko-mazurskie</option>
            <option value="Wielkopolskie">Wielkopolskie</option>
            <option value="Zachodniopomorskie">Zachodniopomorskie</option>
        </select>

        <label for="uwagi">Uwagi:</label>
        <textarea id="uwagi" name="uwagi"
                  placeholder="Wpisz dodatkowe informacje..."></textarea>

        <button type="submit">Wyślij formularz</button>

    </form>

</div>

<script>

    document.getElementById("formularz").addEventListener("submit", function(event) {

        event.preventDefault();

        let poprawny = true;

        // Pobieranie pól
        let imie = document.getElementById("imie");
        let nazwisko = document.getElementById("nazwisko");
        let email = document.getElementById("email");
        let telefon = document.getElementById("telefon");
        let wojewodztwo = document.getElementById("wojewodztwo");

        // Usuwanie poprzednich komunikatów
        document.querySelectorAll(".komunikat").forEach(function(element) {
            element.remove();
        });

        // Sprawdzanie pól
        let pola = [imie, nazwisko, email, telefon, wojewodztwo];

        for (let i = 0; i < pola.length; i++) {

            pola[i].classList.remove("blad");
            pola[i].classList.remove("poprawne");

            if (pola[i].value.trim() == "") {

                pola[i].classList.add("blad");

                let komunikat = document.createElement("p");
                komunikat.className = "komunikat";
                komunikat.innerText = "To pole nie może być puste!";

                pola[i].after(komunikat);

                poprawny = false;

            } else {

                pola[i].classList.add("poprawne");

            }
        }


	
	if (email.value.trim() != "" && !email.value.includes("@")) {

	    email.classList.remove("poprawne");
	    email.classList.add("blad");

	    let komunikat = document.createElement("p");
	    komunikat.className = "komunikat";
	    komunikat.innerText = "Adres e-mail musi zawierać znak @!";

	    email.after(komunikat);
	
	    poprawny = false;
	}


        
        if (telefon.value.trim() != "" && !/^\d{9}$/.test(telefon.value.replace(/\s/g, ""))) {

            telefon.classList.remove("poprawne");
            telefon.classList.add("blad");

            let komunikat = document.createElement("p");
            komunikat.className = "komunikat";
            komunikat.innerText = "Podaj 9 cyfr, np. 123456789!";

            telefon.after(komunikat);

            poprawny = false;
        }

        
        let prawo = document.querySelector('input[name="prawo_jazdy"]:checked');

        if (prawo == null) {

            let komunikat = document.createElement("p");
            komunikat.className = "komunikat";
            komunikat.innerText = "Wybierz Tak lub Nie!";

            document.querySelector(".prawo-jazdy").after(komunikat);

            poprawny = false;
        }

        // Wynik walidacji
        if (poprawny == true) {

            alert("Formularz został poprawnie wypełniony!");

        }

    });

</script>

</body>
</html>
